<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Runner</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script>
        async function runScript() {
            const arg1 = document.getElementById('prompt').value;
            const arg2 = document.getElementById('k').value;

            const response = await fetch('/run-script', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ arg1, arg2 })
            });

            const data = await response.json();
	    document.getElementById('output').innerHTML = data.message;
        }
    </script>
    <style>
        /* Set the background color of the whole page to black */
        body {
            background-color: black;
            color: white; /* Set the text color to white so it's visible on the black background */
	    font-size: 14pt;
        }

        /* Additional custom styles if needed */
	.card {
    		background-color: #333; /* Dark grey */
    		color: white; /* Ensure text in the card is visible */
		font-size: 14pt;
	}
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="mb-3 text-center">Dr. Draft's SOTA Literature Review</h2>
            
            <div class="mb-3">
		    <label for="prompt"> Enter your prompt:</label>
		<textarea id="prompt" name="arg1" rows="5" cols="50" style="width: 100%; resize: vertical; word-wrap: break-word;"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">k</label>
                <input type="text" class="form-control" id="k" placeholder="Enter second argument">
            </div>

            <button class="btn btn-primary w-100" onclick="runScript()">Run Script</button>

            <div id="output" class="mt-4"></div>
        </div>
    </div>

    <!-- Bootstrap JS (Optional, needed for advanced features) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
